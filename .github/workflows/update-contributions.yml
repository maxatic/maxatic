name: Refresh contribution artwork
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: contribution-artwork
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate artwork from the public calendar
        run: python source/generate-contributions.py --username maxatic
      - name: Commit changed artwork
        run: |
          git add assets/contributions-*.svg assets/contributions-data.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh contribution artwork'
          git push
