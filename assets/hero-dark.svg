      <rect x="40" y="155" width="79" height="62" rx="15" class="frame" stroke-width="1.4"/><text x="79" y="193" text-anchor="middle" font-family="Helvetica Neue,Arial,sans-serif" font-size="25" class="mute">?</text>
      <g class="app-icon"><g transform="rotate(-11 284 186)"><rect x="181" y="88" width="211" height="211" rx="46" fill="url(#silver)" opacity=".32"/><rect x="165" y="79" width="211" height="211" rx="46" fill="url(#silver)" filter="url(#shadow)"/><rect x="172" y="85" width="196" height="196" rx="40" fill="url(#face)"/><text x="269" y="226" text-anchor="middle" font-family="Helvetica Neue,Arial,sans-serif" font-weight="600" font-size="156" letter-spacing="-8" fill="#f5f5f7">m</text><svg x="172" y="85" width="196" height="196" viewBox="0 0 196 196"><defs><clipPath id="icon-clip"><rect width="196" height="196" rx="40"/></clipPath><linearGradient id="glint"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><g clip-path="url(#icon-clip)"><path class="sheen" d="M-65-30H5L145 226H75Z" fill="url(#glint)"/></g></svg></g></g>
      <rect x="142" y="53" width="282" height="268" class="accent" stroke-width="1.2" stroke-dasharray="5 5"/>
      <g class="handle handles"><rect x="138" y="49" width="8" height="8"/><rect x="420" y="49" width="8" height="8"/><rect x="138" y="317" width="8" height="8"/><rect x="420" y="317" width="8" height="8"/></g>
      <rect x="450" y="155" width="79" height="62" rx="15" class="frame" stroke-width="1.4"/><path d="m473 185 11 11 19-23" class="accent tick" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
