<svg xmlns="http://www.w3.org/2000/svg" width="800" height="550" viewBox="0 0 800 550"><title>Think. Make. Refine.</title><rect width="800" height="550" rx="28" fill="#f5f5f7"/><g font-family="Helvetica Neue,Arial,sans-serif"><text x="44" y="58" font-size="18" letter-spacing="2" fill="#727276">THE WAY I WORK</text><text x="44" y="141" font-size="20" fill="#727276">01</text><text x="99" y="148" font-size="48" font-weight="600" letter-spacing="-1.5" fill="#1d1d1f">Think.</text><text x="99" y="194" font-size="25" fill="#727276">Start with the problem.</text><text x="44" y="281" font-size="20" fill="#727276">02</text><text x="99" y="288" font-size="48" font-weight="600" letter-spacing="-1.5" fill="#1d1d1f">Make.</text><text x="99" y="334" font-size="25" fill="#727276">Build something useful.</text><text x="44" y="421" font-size="20" fill="#727276">03</text><text x="99" y="428" font-size="48" font-weight="600" letter-spacing="-1.5" fill="#1d1d1f">Refine.</text><text x="99" y="474" font-size="25" fill="#727276">Sweat the details.</text></g></svg>