<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="238" viewBox="0 0 1600 238"><title>Think. Make. Refine.</title><desc>Start with the problem. Build something useful. Sweat the details.</desc><rect width="1600" height="238" rx="30" fill="#19191c"/><g font-family="Helvetica Neue,Arial,sans-serif"><g font-size="14" fill="#a4a4aa" letter-spacing="1.5"><text x="60" y="52">THE WAY I WORK</text><text x="1540" y="52" text-anchor="end">ALWAYS IN PROGRESS.</text></g><text x="60" y="122" font-size="16" fill="#a4a4aa">01</text><text x="100" y="130" font-size="45" font-weight="600" letter-spacing="-1.4" fill="#f5f5f7">Think.</text><text x="100" y="183" font-size="23" fill="#a4a4aa">Start with the problem.</text><text x="590" y="122" font-size="16" fill="#a4a4aa">02</text><text x="630" y="130" font-size="45" font-weight="600" letter-spacing="-1.4" fill="#f5f5f7">Make.</text><text x="630" y="183" font-size="23" fill="#a4a4aa">Build something useful.</text><text x="1120" y="122" font-size="16" fill="#a4a4aa">03</text><text x="1160" y="130" font-size="45" font-weight="600" letter-spacing="-1.4" fill="#f5f5f7">Refine.</text><text x="1160" y="183" font-size="23" fill="#a4a4aa">Sweat the details.</text><path d="M466 130h34m-12-12 12 12-12 12M995 130h34m-12-12 12 12-12 12" fill="none" stroke="#3a3a40" stroke-width="2"/></g></svg>