<svg xmlns="http://www.w3.org/2000/svg" width="800" height="550" viewBox="0 0 800 550"><title>Think. Make. Refine.</title><rect width="800" height="550" rx="28" fill="#19191c"/><g font-family="Helvetica Neue,Arial,sans-serif"><text x="44" y="58" font-size="18" letter-spacing="2" fill="#a4a4aa">THE WAY I WORK</text><text x="44" y="141" font-size="20" fill="#a4a4aa">01</text><text x="99" y="148" font-size="48" font-weight="600" letter-spacing="-1.5" fill="#f5f5f7">Think.</text><text x="99" y="194" font-size="25" fill="#a4a4aa">Start with the problem.</text><text x="44" y="281" font-size="20" fill="#a4a4aa">02</text><text x="99" y="288" font-size="48" font-weight="600" letter-spacing="-1.5" fill="#f5f5f7">Make.</text><text x="99" y="334" font-size="25" fill="#a4a4aa">Build something useful.</text><text x="44" y="421" font-size="20" fill="#a4a4aa">03</text><text x="99" y="428" font-size="48" font-weight="600" letter-spacing="-1.5" fill="#f5f5f7">Refine.</text><text x="99" y="474" font-size="25" fill="#a4a4aa">Sweat the details.</text></g></svg>